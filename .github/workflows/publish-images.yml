name: Publish service images

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/database.yml/runs" -f "head_sha=$GITHUB_SHA" -f per_page=100)
          echo "$runs" | jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last | .status == "completed" and .conclusion == "success"' > /dev/null
      - run: echo 'The current commit passed Database checks.'

  publish:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: myocontrol-data
            context: services/data_protocol
            dockerfile: services/data_protocol/Dockerfile
          - name: myocontrol-experiments
            context: services/ml_experiments
            dockerfile: services/ml_experiments/Dockerfile
          - name: myocontrol-recognition
            context: services/recognition
            dockerfile: services/recognition/Dockerfile
          - name: myocontrol-gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - name: myocontrol-migrator
            context: .
            dockerfile: services/migrator/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
