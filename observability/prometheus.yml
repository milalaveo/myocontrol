global:
  scrape_interval: 5s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: myocontrol-services
    metrics_path: /metrics/
    static_configs:
      - targets: ["gateway:8000", "data-protocol:8001", "ml-experiments:8002", "recognition:8003"]
